name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Content check
        run: node tools/check.js
      # dist/ isn't committed any more (release.yml builds it and publishes it as a Release); this only proves the build still works
      - name: The single-file build works
        run: node tools/build.js && ls -l dist/terminal.html
