name: lessons

# runs every lesson's `ci` checks (tools/ci-run.js) on a real Linux, macOS and Windows machine
on:
  push:
    paths: ['js/**', 'tools/ci-run.js', '.github/workflows/lessons.yml']
  workflow_dispatch:

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run the lesson checks
        run: node tools/ci-run.js
